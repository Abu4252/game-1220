<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BIZ — BIRGA | Abdulhodiy & Robiya Bibi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b0914; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #23153c 0%, #0b0914 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 15px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 1rem; margin-bottom: 20px; color: #d8cce6; max-width: 450px; line-height: 1.5; }
        .btn { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 8px; box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4); }
        .input-group { margin: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        input[type="text"] { padding: 12px 20px; font-size: 1.2rem; border-radius: 30px; border: 2px solid #ff758c; background: rgba(255,255,255,0.08); color: white; text-align: center; width: 240px; outline: none; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; font-size: 1rem; font-weight: bold; }
        .badge { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 15px; border: 1px solid rgba(255,117,140,0.3); }
        #quest-banner { background: rgba(15, 10, 30, 0.9); border: 2px solid #ff758c; padding: 15px 20px; border-radius: 15px; text-align: center; max-width: 500px; margin: 0 auto; backdrop-filter: blur(10px); }
        .controls-container { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding-bottom: 10px; }
        .joystick-base { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; touch-action: none; }
        .joystick-thumb { width: 40px; height: 40px; background: linear-gradient(135deg, #ff758c, #ff7eb3); border-radius: 50%; position: absolute; top: 30px; left: 30px; pointer-events: none; }
        .round-btn { width: 60px; height: 60px; background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; border-radius: 50%; color: white; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #dialog-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,10,30,0.95); border: 2px solid #ff758c; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; z-index: 50; display: none; text-align: center; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <h1>❤️ ABDULHODIY ❤️ ROBIYA BIBI</h1>
        <p>“Yolg‘iz odam uchun emas, ikki yurak uchun yaratilgan romantik dunyo.”</p>
        
        <div class="input-group">
            <label style="font-size: 0.85rem; color: #ff758c; font-weight: bold;">KIMSIZ?</label>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="btn-abdulhodiy" style="padding: 10px 18px; font-size: 0.95rem;">👨🏻 Abdulhodiy</button>
                <button class="btn" id="btn-robiya" style="padding: 10px 18px; font-size: 0.95rem; background: linear-gradient(135deg, #9b59b6, #8e44ad);">👩🏻 Robiya Bibi</button>
            </div>
        </div>

        <div class="input-group">
            <label style="font-size: 0.85rem; color: #ff758c; font-weight: bold;">MAXFIY XONA KODI</label>
            <input type="text" id="room-code-input" value="LOVE-1220">
        </div>

        <button class="btn interactive" id="enter-game-btn" style="margin-top: 10px;">O‘YINGA KIRISH ❤️</button>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer" id="game-ui" style="display: none;">
        <div class="hud-top">
            <div class="badge" id="player-identity-badge">Rol: Aniqlanmoqda</div>
            <div class="badge">Bosqich: 1 / 7</div>
        </div>

        <div id="quest-banner">
            <div id="quest-title" style="font-size: 1.2rem; color: #ff758c; font-weight: bold; margin-bottom: 5px;">1-bosqich: “Birinchi uchrashuv”</div>
            <div id="quest-desc" style="font-size: 0.95rem; color: #e2d9ed;">Bog‘ ichida bir-biringizni toping va yonma-yon keling! ❤️</div>
            <button class="btn interactive" id="quest-action-btn" style="padding: 8px 20px; font-size: 0.9rem; display: none; margin-top: 10px;">Bajarish ❤️</button>
        </div>

        <div class="controls-container">
            <div class="joystick-base interactive" id="joystick">
                <div class="joystick-thumb" id="joystick-thumb"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="round-btn interactive" id="btn-action">🤝</button>
                <button class="round-btn interactive" id="btn-chat" onclick="alert('🎙️ Voice chat faol! Bir-biringiz bilan gaplashing.')">🎙️</button>
            </div>
        </div>
    </div>

    <div id="dialog-modal">
        <div id="dialog-text" style="font-size: 1rem; margin-bottom: 20px; line-height: 1.5;">Xabar matni...</div>
        <button class="btn interactive" id="dialog-yes-btn" style="padding: 10px 20px; font-size: 0.95rem;">HA ❤️</button>
    </div>

    <!-- Three.js Kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let currentRole = null, isGameStarted = false, currentStage = 1;
        let scene, camera, renderer, myAvatar, partnerAvatar;
        let joystickVector = { x: 0, y: 0 }, moveJoystickActive = false;
        let collectedHearts = 0;
        let stageObjectsGroup = new THREE.Group();

        document.getElementById('btn-abdulhodiy').addEventListener('click', () => {
            currentRole = 'abdulhodiy';
            event.target.style.border = "3px solid #fff";
            document.getElementById('btn-robiya').style.border = "none";
        });

        document.getElementById('btn-robiya').addEventListener('click', () => {
            currentRole = 'robiya';
            event.target.style.border = "3px solid #fff";
            document.getElementById('btn-abdulhodiy').style.border = "none";
        });

        document.getElementById('enter-game-btn').addEventListener('click', () => {
            if (!currentRole) { alert("Iltimos, avval o‘z rolingizni tanlang ❤️"); return; }
            if (document.getElementById('room-code-input').value.trim() !== "LOVE-1220") { alert("Noto‘g‘ri kod! LOVE-1220 kiriting ❤️"); return; }

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            isGameStarted = true;
            document.getElementById('player-identity-badge').innerText = currentRole === 'abdulhodiy' ? "👨🏻 Abdulhodiy" : "👩🏻 Robiya Bibi";
            
            initGame();
        });

        function initGame() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0914);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(10, 20, 10);
            scene.add(light);

            // Zamin
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshStandardMaterial({ color: 0x1a1226 }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            scene.add(stageObjectsGroup);

            // Qahramonlar
            const abdul = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x3a506b }));
            abdul.position.set(-8, 1, 0);
            scene.add(abdul);

            const robiya = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2), new THREE.MeshStandardMaterial({ color: 0xff758c }));
            robiya.position.set(8, 1, 0);
            scene.add(robiya);

            myAvatar = currentRole === 'abdulhodiy' ? abdul : robiya;
            partnerAvatar = currentRole === 'abdulhodiy' ? robiya : abdul;

            setupJoysticks();
            animate();
        }

        function setupJoysticks() {
            const joystick = document.getElementById('joystick');
            const thumb = document.getElementById('joystick-thumb');
            let center = { x: 0, y: 0 };

            joystick.addEventListener('touchstart', (e) => {
                moveJoystickActive = true;
                const rect = joystick.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            window.addEventListener('touchmove', (e) => {
                if (!moveJoystickActive) return;
                let t = e.touches[0];
                let dx = t.clientX - center.x, dy = t.clientY - center.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 30) { dx = (dx/dist)*30; dy = (dy/dist)*30; }
                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.x = dx / 30; joystickVector.y = dy / 30;
            });

            window.addEventListener('touchend', () => {
                moveJoystickActive = false; joystickVector.x = 0; joystickVector.y = 0;
                thumb.style.transform = `translate(0px, 0px)`;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameStarted && myAvatar) {
                myAvatar.position.x += joystickVector.x * 0.12;
                myAvatar.position.z += joystickVector.y * 0.12;

                camera.position.set(myAvatar.position.x, myAvatar.position.y + 5, myAvatar.position.z + 8);
                camera.lookAt(myAvatar.position);

                if (currentStage === 1 && myAvatar.position.distanceTo(partnerAvatar.position) < 3) {
                    alert("❤️ Ular bir-birini topishdi! 1-bosqich yakunlandi.");
                    currentStage = 2;
                    document.getElementById('quest-title').innerText = "2-bosqich: “Ikki Yurak”";
                    document.getElementById('quest-desc').innerText = "Eshikni ochish uchun tugmani bosing!";
                    document.getElementById('quest-action-btn').style.display = 'inline-block';
                }
            }
            renderer.render(scene, camera);
        }

        document.getElementById('quest-action-btn').addEventListener('click', () => {
            if (currentStage === 2) {
                alert("🚪 Eshik ochildi! Keyingi bosqichga o'tamiz ❤️");
                currentStage = 3;
                document.getElementById('quest-title').innerText = "3-bosqich: “Menga Ishon”";
                document.getElementById('quest-desc').innerText = "Ko'prikni birga tiklaymiz!";
                document.getElementById('quest-action-btn').style.display = 'none';
            }
        });
    </script>
</body>
</html>
