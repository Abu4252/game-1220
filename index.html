<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIZ — BIRGA | Abdulhodiy & Robiya Bibi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b0914; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }
        
        /* Kirish ekrani */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #2d1b4e 0%, #0b0914 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; }
        h1 { font-size: 1.9rem; margin-bottom: 10px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; text-shadow: 0 0 20px rgba(255,117,140,0.4); }
        p { font-size: 0.95rem; margin-bottom: 20px; color: #e2d9ed; max-width: 400px; line-height: 1.5; }
        
        .btn { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 8px; box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5); transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        
        .input-group { margin: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        input[type="text"] { padding: 12px 20px; font-size: 1.2rem; border-radius: 30px; border: 2px solid #ff758c; background: rgba(255,255,255,0.08); color: white; text-align: center; width: 240px; outline: none; letter-spacing: 2px; }
        
        /* HUD Panellar */
        .hud-top { display: flex; justify-content: space-between; width: 100%; font-size: 0.95rem; font-weight: bold; }
        .badge { background: rgba(15,10,30,0.8); padding: 8px 14px; border-radius: 18px; border: 1px solid rgba(255,117,140,0.4); backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #quest-banner { background: rgba(15, 10, 30, 0.9); border: 2px solid #ff758c; padding: 15px 20px; border-radius: 20px; text-align: center; max-width: 420px; margin: 0 auto; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        
        .controls-container { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding-bottom: 5px; }
        
        /* Joystik */
        .joystick-base { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; position: relative; touch-action: none; backdrop-filter: blur(5px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .joystick-thumb { width: 50px; height: 50px; background: linear-gradient(135deg, #ff758c, #ff7eb3); border-radius: 50%; position: absolute; top: 33px; left: 33px; pointer-events: none; box-shadow: 0 4px 15px rgba(255,117,140,0.6); }
        
        .action-buttons { display: flex; gap: 12px; }
        .round-btn { width: 62px; height: 62px; background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; border-radius: 50%; color: white; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(255,65,108,0.5); }
        .round-btn:active { transform: scale(0.92); }

        /* Romantik Dialog va Xatlar oynasi */
        #dialog-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,10,30,0.97); border: 2px solid #ff758c; padding: 25px; border-radius: 24px; width: 88%; max-width: 380px; z-index: 50; display: none; text-align: center; backdrop-filter: blur(15px); box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <!-- Kirish ekrani -->
    <div id="welcome-screen" class="screen">
        <h1>❤️ ABDULHODIY ❤️ ROBIYA BIBI</h1>
        <p>“Ishqiy sarguzashtim, butun olamim va tanho xabarlarim egasiga bag‘ishlanadi.”</p>
        
        <div class="input-group">
            <label style="font-size: 0.85rem; color: #ff758c; font-weight: bold;">KIMSIZ?</label>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="btn-abdulhodiy" style="padding: 10px 20px; font-size: 0.95rem;">👨🏻 Abdulhodiy</button>
                <button class="btn" id="btn-robiya" style="padding: 10px 20px; font-size: 0.95rem; background: linear-gradient(135deg, #9b59b6, #8e44ad);">👩🏻 Robiya Bibi</button>
            </div>
        </div>

        <div class="input-group">
            <label style="font-size: 0.85rem; color: #ff758c; font-weight: bold;">MAXFIY XONA KODI</label>
            <input type="text" id="room-code-input" value="LOVE-1220">
        </div>

        <button class="btn interactive" id="enter-game-btn" style="margin-top: 10px;">DUNYOGA KIRISH ❤️</button>
    </div>

    <div id="canvas-container"></div>

    <!-- O'yin interfeysi HUD -->
    <div class="ui-layer" id="game-ui" style="display: none;">
        <div class="hud-top">
            <div class="badge" id="player-identity-badge">Rol: Tanlanmoqda</div>
            <div class="badge" id="stage-badge">Bosqich: 1 / 7</div>
        </div>

        <div id="quest-banner">
            <div id="quest-title" style="font-size: 1.15rem; color: #ff758c; font-weight: bold; margin-bottom: 5px;">1-bosqich: “Ishqiy Bog‘”</div>
            <div id="quest-desc" style="font-size: 0.9rem; color: #e2d9ed; line-height: 1.4;">Joystik yordamida harakatlanib, bir-biringizni toping va quchoqlashing! ❤️</div>
            <button class="btn interactive" id="quest-action-btn" style="padding: 8px 22px; font-size: 0.9rem; display: none; margin-top: 10px;">Sevgi izhori ❤️</button>
        </div>

        <div class="controls-container">
            <div class="joystick-base interactive" id="joystick">
                <div class="joystick-thumb" id="joystick-thumb"></div>
            </div>
            <div class="action-buttons">
                <button class="round-btn interactive" id="btn-action" title="O‘zaro ta'sir">🤝</button>
                <button class="round-btn interactive" id="btn-chat" onclick="alert('🎙️ Romantik ovozli chat ulandi! Bir-biringizga sevgi so‘zlarini ayting.')" title="Chat">🎙️</button>
            </div>
        </div>
    </div>

    <!-- Maxsus xatlar va savollar oynasi -->
    <div id="dialog-modal">
        <div id="dialog-text" style="font-size: 1rem; margin-bottom: 20px; line-height: 1.5; color: #fce4ec;">Xabar matni...</div>
        <button class="btn interactive" id="dialog-yes-btn" style="padding: 10px 24px; font-size: 0.95rem;">DAVOM ETISH ❤️</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let currentRole = null, isGameStarted = false, currentStage = 1;
        let scene, camera, renderer, myAvatar, partnerAvatar;
        let joystickVector = { x: 0, y: 0 }, moveJoystickActive = false;

        document.getElementById('btn-abdulhodiy').addEventListener('click', (e) => {
            currentRole = 'abdulhodiy';
            e.target.style.border = "3px solid #fff";
            document.getElementById('btn-robiya').style.border = "none";
        });

        document.getElementById('btn-robiya').addEventListener('click', (e) => {
            currentRole = 'robiya';
            e.target.style.border = "3px solid #fff";
            document.getElementById('btn-abdulhodiy').style.border = "none";
        });

        document.getElementById('enter-game-btn').addEventListener('click', () => {
            if (!currentRole) { alert("Iltimos, avval o‘z rolingizni tanlang ❤️"); return; }
            if (document.getElementById('room-code-input').value.trim() !== "LOVE-1220") { alert("Noto‘g‘ri kod! LOVE-1220 kiriting ❤️"); return; }

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            isGameStarted = true;
            document.getElementById('player-identity-badge').innerText = currentRole === 'abdulhodiy' ? "👨🏻 Abdulhodiy" : "👩🏻 Robiya Bibi";
            
            initGame();
        });

        function initGame() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0914);
            scene.fog = new THREE.FogExp2(0x0b0914, 0.018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Yorug'liklar
            scene.add(new THREE.AmbientLight(0xffb6c1, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 0.9);
            light.position.set(15, 25, 15);
            scene.add(light);

            // Romantik Bog' Zamini
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ color: 0x181124, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Atrofga porlab turuvchi romantik daraxtlar va gullar qo'shamiz
            for (let i = 0; i < 30; i++) {
                const treeGroup = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.6, 3),
                    new THREE.MeshStandardMaterial({ color: 0x4a3b5c })
                );
                trunk.position.y = 1.5;
                
                const leaves = new THREE.Mesh(
                    new THREE.SphereGeometry(1.8, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff758c, emissive: 0x3d1424 })
                );
                leaves.position.y = 3.2;
                
                treeGroup.add(trunk);
                treeGroup.add(leaves);
                
                treeGroup.position.set(
                    (Math.random() - 0.5) * 120,
                    0,
                    (Math.random() - 0.5) * 120
                );
                if (Math.abs(treeGroup.position.x) > 5 || Math.abs(treeGroup.position.z) > 5) {
                    scene.add(treeGroup);
                }
            }

            // Qahramonlar (Abdulhodiy va Robiya Bibi)
            const abdul = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.6, 1.4, 4, 16),
                new THREE.MeshStandardMaterial({ color: 0x3a506b, roughness: 0.3 })
            );
            abdul.position.set(-8, 1.3, 0);
            scene.add(abdul);

            const robiya = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.55, 1.4, 4, 16),
                new THREE.MeshStandardMaterial({ color: 0xff758c, roughness: 0.3 })
            );
            robiya.position.set(8, 1.3, 0);
            scene.add(robiya);

            myAvatar = currentRole === 'abdulhodiy' ? abdul : robiya;
            partnerAvatar = currentRole === 'abdulhodiy' ? robiya : abdul;

            setupJoysticks();
            animate();
            window.addEventListener('resize', onWindowResize);
        }

        function setupJoysticks() {
            const joystick = document.getElementById('joystick');
            const thumb = document.getElementById('joystick-thumb');
            let center = { x: 0, y: 0 };
            const maxDist = 36;

            joystick.addEventListener('touchstart', (e) => {
                moveJoystickActive = true;
                const rect = joystick.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            window.addEventListener('touchmove', (e) => {
                if (!moveJoystickActive) return;
                let t = e.touches[0];
                let dx = t.clientX - center.x;
                let dy = t.clientY - center.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.x = dx / maxDist;
                joystickVector.y = dy / maxDist;
            });

            window.addEventListener('touchend', () => {
                moveJoystickActive = false;
                joystickVector.x = 0;
                joystickVector.y = 0;
                thumb.style.transform = `translate(0px, 0px)`;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameStarted && myAvatar) {
                // Joystik orqali silliq harakatlanish
                myAvatar.position.x += joystickVector.x * 0.16;
                myAvatar.position.z += joystickVector.y * 0.16;

                // Kamera qahramonni kuzatib boradi
                camera.position.set(myAvatar.position.x, myAvatar.position.y + 6, myAvatar.position.z + 9);
                camera.lookAt(myAvatar.position);

                // 1-bosqich: Bir-birini topish
                if (currentStage === 1 && myAvatar.position.distanceTo(partnerAvatar.position) < 3.0) {
                    currentStage = 2;
                    document.getElementById('stage-badge').innerText = "Bosqich: 2 / 7";
                    document.getElementById('quest-title').innerText = "2-bosqich: “Ikki Yurak Uchrashuvi”";
                    document.getElementById('quest-desc').innerText = "Siz bir-biringizni topdingiz! Ishqiy xabarni o'qish uchun tugmani bosing.";
                    document.getElementById('quest-action-btn').style.display = 'inline-block';
                }
            }
            renderer.render(scene, camera);
        }

        document.getElementById('quest-action-btn').addEventListener('click', () => {
            if (currentStage === 2) {
                const modal = document.getElementById('dialog-modal');
                document.getElementById('dialog-text').innerText = "“Ishqiy xabarlarim tanxo sengadir...” — Abdulhodiy va Robiya Bibi qalblari abadiy birga! ❤️ 03.03.2026";
                modal.style.display = 'block';
                document.getElementById('quest-action-btn').style.display = 'none';
            }
        });

        document.getElementById('dialog-yes-btn').addEventListener('click', () => {
            document.getElementById('dialog-modal').style.display = 'none';
            currentStage = 3;
            document.getElementById('stage-badge').innerText = "Bosqich: 3 / 7";
            document.getElementById('quest-title').innerText = "3-bosqich: “Sevgi Yo‘lagi”";
            document.getElementById('quest-desc').innerText = "Keyingi sarguzasht va xotiralar sari olg'a qadam tashlang! ❤️";
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
