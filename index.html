<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABDULHODIY & ROBIYA BIBI — HTML5 GAME WORLD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #05030a; color: #fff; }
        
        /* Maxfiy Kod Ekrani */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #231238 0%, #05030a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; text-align: center; }
        .auth-card { background: rgba(20, 12, 35, 0.95); border: 2px solid rgba(255, 117, 140, 0.5); padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 420px; backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        h1 { font-size: 1.8rem; margin-bottom: 12px; background: linear-gradient(45deg, #ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .subtitle { font-size: 0.95rem; color: #d8cce6; margin-bottom: 25px; line-height: 1.5; }
        
        .role-selector { display: flex; gap: 12px; justify-content: center; margin-bottom: 22px; }
        .role-btn { flex: 1; padding: 14px; border-radius: 18px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .role-btn.selected { border-color: #ff758c; background: linear-gradient(135deg, rgba(255,117,140,0.35), rgba(255,75,43,0.35)); box-shadow: 0 6px 20px rgba(255,65,108,0.4); }
        
        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; color: #ff758c; font-weight: bold; margin-bottom: 8px; text-align: center; letter-spacing: 1px; }
        .code-input { width: 100%; padding: 15px; font-size: 1.3rem; border-radius: 18px; border: 2px solid rgba(255,117,140,0.6); background: rgba(0,0,0,0.5); color: white; text-align: center; outline: none; letter-spacing: 3px; font-weight: bold; }
        
        .main-btn { width: 100%; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border: none; padding: 16px; font-size: 1.1rem; border-radius: 18px; cursor: pointer; font-weight: bold; box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5); transition: transform 0.2s; }
        .main-btn:active { transform: scale(0.97); }

        /* HTML5 Canvas Maydoni */
        #game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; background: radial-gradient(circle at center, #1b0f2e 0%, #05030a 100%); }

        /* HUD va Boshqaruv Qatlami */
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto !important; }
        
        .hud-top { display: flex; justify-content: space-between; width: 100%; font-size: 1rem; font-weight: bold; }
        .badge { background: rgba(15, 10, 30, 0.85); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(255,117,140,0.4); backdrop-filter: blur(12px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        #quest-banner { background: rgba(15, 10, 30, 0.92); border: 2px solid #ff758c; padding: 18px 24px; border-radius: 22px; text-align: center; max-width: 460px; margin: 0 auto; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .controls-container { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding-bottom: 10px; }
        
        /* Joystik */
        .joystick-base { width: 130px; height: 130px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; position: relative; touch-action: none; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .joystick-thumb { width: 54px; height: 54px; background: linear-gradient(135deg, #ff758c, #ff7eb3); border-radius: 50%; position: absolute; top: 36px; left: 36px; pointer-events: none; box-shadow: 0 4px 15px rgba(255,117,140,0.7); }
        
        .action-buttons { display: flex; gap: 14px; }
        .round-btn { width: 66px; height: 66px; background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; border-radius: 50%; color: white; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(255,65,108,0.6); }
        .round-btn:active { transform: scale(0.92); }

        /* Modal Xatlar Oynasi */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-card { background: rgba(20, 12, 35, 0.96); border: 2px solid #ff758c; padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.9); }
        .modal-text { font-size: 1.1rem; line-height: 1.7; color: #fce4ec; margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- Kirish va Kod tekshiruv ekrani -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>❤️ ABDULHODIY & ROBIYA BIBI ❤️</h1>
            <p class="subtitle">HTML5 o'yin dunyosi. Rolingizni tanlang va maxfiy kodni kiriting.</p>
            
            <div class="role-selector">
                <button class="role-btn selected" id="role-abdul" onclick="selectRole('abdulhodiy')">👨🏻 Abdulhodiy</button>
                <button class="role-btn" id="role-robiya" onclick="selectRole('robiya')">👩🏻 Robiya Bibi</button>
            </div>

            <div class="input-group">
                <label>Maxfiy Kod (LOVE-1220)</label>
                <input type="text" id="passcode-input" class="code-input" value="LOVE-1220" placeholder="Kodni kiriting">
            </div>

            <button class="main-btn interactive" onclick="verifyAndEnter()">O‘YINNI BOSHLASH ❤️</button>
        </div>
    </div>

    <!-- HTML5 Canvas O'yin Sahnasi -->
    <canvas id="game-canvas"></canvas>

    <!-- O'yin Interfeysi -->
    <div class="ui-layer" id="game-ui" style="display: none;">
        <div class="hud-top">
            <div class="badge" id="hud-role">Rol: Abdulhodiy</div>
            <div class="badge" id="hud-stage">Bosqich: 1 / 7</div>
        </div>

        <div id="quest-banner">
            <div id="quest-title" style="font-size: 1.25rem; color: #ff758c; font-weight: bold; margin-bottom: 6px;">1-bosqich: “Ishqiy Bog‘”</div>
            <div id="quest-desc" style="font-size: 1rem; color: #e2d9ed; line-height: 1.5;">Joystik yordamida harakatlanib, partnerimgizni toping va quchoqlashing! ❤️</div>
            <button class="main-btn interactive" id="quest-btn" style="padding: 10px 24px; font-size: 0.95rem; display: none; margin-top: 14px;" onclick="handleQuestAction()">XATNI O‘QISH ❤️</button>
        </div>

        <div class="controls-container">
            <div class="joystick-base interactive" id="joystick-base">
                <div class="joystick-thumb" id="joystick-thumb"></div>
            </div>
            <div class="action-buttons">
                <button class="round-btn interactive" onclick="triggerHug()" title="Quchoqlashish">🤝</button>
                <button class="round-btn interactive" onclick="toggleAudio()" title="Musiqa">🎵</button>
            </div>
        </div>
    </div>

    <!-- Xatlar Modal Oynasi -->
    <div id="modal-overlay">
        <div class="modal-card">
            <div id="modal-content" class="modal-text">Xabar matni...</div>
            <button class="main-btn interactive" onclick="closeModal()">DAVOM ETISH ❤️</button>
        </div>
    </div>

    <script>
        let selectedRole = 'abdulhodiy';
        let currentStage = 1;
        let canvas, ctx;
        let player = { x: 200, y: 200, speed: 4, radius: 24, color: '#3a506b', name: 'Abdulhodiy' };
        let partner = { x: 400, y: 300, radius: 24, color: '#ff758c', name: 'Robiya Bibi' };
        let joystick = { active: false, dx: 0, dy: 0, cx: 0, cy: 0 };
        let audioCtx = null, isAudioPlaying = false;

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-abdul').classList.remove('selected');
            document.getElementById('role-robiya').classList.remove('selected');
            if (role === 'abdulhodiy') {
                document.getElementById('role-abdul').classList.add('selected');
            } else {
                document.getElementById('role-robiya').classList.add('selected');
            }
        }

        function verifyAndEnter() {
            const val = document.getElementById('passcode-input').value.trim();
            if (val !== "LOVE-1220") {
                alert("❌ Noto'g'ri kod! LOVE-1220 ni kiriting ❤️");
                return;
            }

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-canvas').style.display = 'block';
            document.getElementById('game-ui').style.display = 'flex';

            if (selectedRole === 'abdulhodiy') {
                player.name = 'Abdulhodiy'; player.color = '#3a506b';
                partner.name = 'Robiya Bibi'; partner.color = '#ff758c';
                document.getElementById('hud-role').innerText = "Rol: Abdulhodiy";
            } else {
                player.name = 'Robiya Bibi'; player.color = '#ff758c';
                partner.name = 'Abdulhodiy'; partner.color = '#3a506b';
                document.getElementById('hud-role').innerText = "Rol: Robiya Bibi";
            }

            initGame();
        }

        function initGame() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            player.x = window.innerWidth / 2 - 100;
            player.y = window.innerHeight / 2;
            partner.x = window.innerWidth / 2 + 100;
            partner.y = window.innerHeight / 2;

            setupJoystick();
            initAudio();
            gameLoop();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const maxR = 45;

            base.addEventListener('touchstart', (e) => {
                joystick.active = true;
                const rect = base.getBoundingClientRect();
                joystick.cx = rect.left + rect.width / 2;
                joystick.cy = rect.top + rect.height / 2;
            });

            window.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                const t = e.touches[0];
                let dx = t.clientX - joystick.cx;
                let dy = t.clientY - joystick.cy;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }

                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystick.dx = dx / maxR;
                joystick.dy = dy / maxR;
            });

            window.addEventListener('touchend', () => {
                joystick.active = false;
                joystick.dx = 0;
                joystick.dy = 0;
                thumb.style.transform = `translate(0px, 0px)`;
            });
        }

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                playBackgroundMelody();
                isAudioPlaying = true;
            } catch (e) {}
        }

        function playBackgroundMelody() {
            if (!audioCtx || !isAudioPlaying) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.linearRampToValueAtTime(440, now + 3);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.linearRampToValueAtTime(0, now + 4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 4);
            setTimeout(playBackgroundMelody, 5000);
        }

        function toggleAudio() {
            isAudioPlaying = !isAudioPlaying;
            alert(isAudioPlaying ? "🎵 Musiqa yoqildi!" : "🔇 Musiqa o'chirildi.");
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            player.x += joystick.dx * player.speed;
            player.y += joystick.dy * player.speed;

            // Chegaradan chiqib ketmaslik
            player.x = Math.max(30, Math.min(window.innerWidth - 30, player.x));
            player.y = Math.max(30, Math.min(window.innerHeight - 30, player.y));

            // Partner bilan masofa
            let dist = Math.hypot(player.x - partner.x, player.y - partner.y);
            if (currentStage === 1 && dist < 65) {
                currentStage = 2;
                document.getElementById('hud-stage').innerText = "Bosqich: 2 / 7";
                document.getElementById('quest-title').innerText = "2-bosqich: “Topishdik!”";
                document.getElementById('quest-desc').innerText = "Bir-biringizni topdingiz! Maxsus xatni ochish uchun tugmani bosing.";
                document.getElementById('quest-btn').style.display = 'inline-block';
            }
        }

        function render() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Fon bezaklari (Gullar va yuraklar)
            ctx.fillStyle = "rgba(255, 117, 140, 0.08)";
            ctx.beginPath();
            ctx.arc(window.innerWidth / 2, window.innerHeight / 2, 220, 0, Math.PI * 2);
            ctx.fill();

            // Partnerni chizish
            drawCharacter(partner);
            // O'yinchi (Abdulhodiy / Robiya) chizish
            drawCharacter(player);
        }

        function drawCharacter(ch) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ch.x, ch.y, ch.radius, 0, Math.PI * 2);
            ctx.fillStyle = ch.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.fillStyle = "#fff";
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(ch.name, ch.x, ch.y - 34);
            ctx.restore();
        }

        function handleQuestAction() {
            if (currentStage === 2) {
                showModal("“Ishqiy xabarlarim tanxo sengadir...” — Abdulhodiy va Robiya Bibi qalblari abadiy birga! ❤️ 03.03.2026");
                currentStage = 3;
                document.getElementById('hud-stage').innerText = "Bosqich: 3 / 7";
                document.getElementById('quest-title').innerText = "3-bosqich: “Sevgi Yo‘lagi”";
                document.getElementById('quest-desc').innerText = "Keyingi sarguzasht va xotiralar sari olg'a!";
                document.getElementById('quest-btn').style.display = 'none';
            }
        }

        function triggerHug() {
            let dist = Math.hypot(player.x - partner.x, player.y - partner.y);
            if (dist < 80) {
                showModal("🤗 Abdulhodiy va Robiya Bibi quchoqlashishdi! Muhabbatimiz abadiy bardavom bo'lsin. ❤️ 03.03.2026");
            } else {
                alert("❤️ Partneringizga biroz yaqinroq boring!");
            }
        }

        function showModal(text) {
            document.getElementById('modal-content').innerText = text;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
