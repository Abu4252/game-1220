<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulhodiy ❤️ Robiya Bibi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-content">
            <h1>Abdulhodiy ❤️ Robiya Bibi</h1>
            <p id="loading-text">Bizning dunyomiz tayyorlanmoqda...</p>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Entry Screen -->
    <div id="entry-screen" class="hidden">
        <div class="entry-card">
            <h2>Bizning Hikoyamiz</h2>
            <p class="date-text">03.03.2026</p>
            <p>Shu kuni boshlangan hikoya... endi o‘yin sifatida davom etadi.</p>
            
            <div class="input-group">
                <input type="password" id="secret-code-input" placeholder="Toping-chi?">
                <button id="enter-btn">Kirish</button>
            </div>
            <p id="error-msg" class="error-hidden">Xato kod! Qaytadan urinib ko‘ring.</p>
        </div>
    </div>

    <!-- Main Game Container (Keyingi fazalarda ishlatiladi) -->
    <div id="game-container" class="hidden"></div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
